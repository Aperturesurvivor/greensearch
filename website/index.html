<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arboris: Low-Carbon AI Chat</title>
<meta name="description" content="Arboris: lower-carbon AI chat. Shorter prompts, right-sized answers, estimated energy per answer.">
<meta property="og:title" content="Arboris">
<meta property="og:description" content="Lower-carbon AI chat with right-sized answers and an honest energy estimate.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2028%2028'%3E%3Cpath%20d='M14%203C14%203%206%208%206%2016c0%204.4%203.6%208%208%208s8-3.6%208-8C22%208%2014%203%2014%203z'%20fill='%233f8a4e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside class="sidebar" id="sidebar" aria-label="Chats">
  <div class="side-head">
    <a class="side-brand" href="index.html" aria-label="Arboris home">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3C14 3 6 8 6 16c0 4.4 3.6 8 8 8s8-3.6 8-8C22 8 14 3 14 3z"/><path d="M14 10v12M14 14c-2.5-1.5-4-3-4-3M14 17c2-1 3.5-2.5 3.5-2.5" stroke-linecap="round" stroke-width="1.5"/></svg>
      Arboris
    </a>
    <button class="side-toggle" id="side-toggle" type="button" aria-label="Toggle chat list" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
  <button class="new-chat" id="new-chat-btn" type="button">＋ New chat</button>
  <div class="chats-label" aria-hidden="true">Chats</div>
  <p class="sr-only" id="chat-list-help">Drag a chat to reorder it, or use Alt and the up or down arrow keys. Right click or press Shift F10 for chat options.</p>
  <div class="chat-rail" id="chat-rail">
    <div class="chat-highlight" id="chat-highlight" aria-hidden="true" hidden></div>
    <nav class="chat-list" id="chat-list" aria-label="Past chats" aria-describedby="chat-list-help"></nav>
  </div>
  <div class="sr-only" id="chat-order-status" role="status" aria-live="polite"></div>
  <div class="side-acct">
    <button class="acct" id="acct-btn" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false">
      <span class="acct-ring">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle class="ring-bg" cx="20" cy="20" r="17"/><circle class="ring-fg" id="ring-fg" cx="20" cy="20" r="17"/></svg>
        <span class="acct-face">A</span>
      </span>
    </button>
    <div class="acct-pop" id="acct-pop" hidden>
      <a href="features.html">Features</a>
      <a href="https://github.com/succulentsdev/Arboris" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</aside>
<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="main">
  <button class="side-open" id="side-open" type="button" aria-label="Open chat list"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

  <div class="empty" id="empty">
    <h1>What should we plant today?</h1>
    <div class="chips">
      <button class="chip" type="button" data-q="Explain DNS simply">Explain DNS simply</button>
      <button class="chip" type="button" data-q="How does photosynthesis work?">How does photosynthesis work?</button>
      <button class="chip" type="button" data-q="Write a haiku about a forest">Write a haiku about a forest</button>
    </div>
    <div id="composer-home"></div>
  </div>

  <main class="thread" id="thread" aria-label="Conversation">
    <div class="thread-inner" id="chat" role="region" aria-label="Messages"></div>
  </main>
  <div class="sr-only" id="sr-live" aria-live="polite" aria-atomic="true"></div>
  <div id="composer-dock"></div>

  <footer class="composer" id="composer">
    <div class="composer-inner">
      <div id="attachment-list" class="attachment-list" aria-label="Files ready to send" hidden></div>
      <div class="composer-row">
        <button class="btn-attach" id="attach-btn" type="button" aria-label="Attach files" title="Images, PDFs and text files · up to 5 MB each"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <input id="file-input" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.csv,.json,.jsonl,.yaml,.yml,.log,.py,.js,.ts,.css,.html,.xml,.sql,.toml" hidden>
        <textarea id="ci" rows="1" placeholder="Ask anything" autocomplete="off" aria-label="Your question"></textarea>
        <button class="btn-send" id="sb" type="button" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16z"/><path d="M4 20C8 14 12 10 20 4"/></svg></button>
      </div>
    </div>
  </footer>
</div>

<div id="toast" role="status"></div>
<div id="cache-flash" aria-hidden="true"></div>
<div id="file-drop-overlay" class="file-drop-overlay" aria-hidden="true"><span>Drop files to attach</span></div>
<div id="chat-menu" class="chat-menu" role="menu" aria-label="Chat options" hidden>
  <button type="button" role="menuitem" data-chat-command="rename">Rename</button>
  <button type="button" role="menuitem" data-chat-command="delete">Delete</button>
</div>
<dialog id="chat-rename-dialog" class="chat-dialog" aria-labelledby="chat-rename-title">
  <form method="dialog">
    <h2 id="chat-rename-title">Rename chat</h2>
    <label for="chat-name">Chat name</label>
    <input id="chat-name" name="title" required maxlength="120" autocomplete="off">
    <div class="chat-dialog-actions">
      <button type="submit" value="cancel" formnovalidate>Cancel</button>
      <button type="submit" value="confirm" class="primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="chat-delete-dialog" class="chat-dialog" aria-labelledby="chat-delete-title">
  <form method="dialog">
    <h2 id="chat-delete-title">Delete chat?</h2>
    <p id="chat-delete-description"></p>
    <div class="chat-dialog-actions">
      <button type="submit" value="cancel">Cancel</button>
      <button type="submit" value="confirm" class="primary">Delete</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
/* V5 page behavior: empty state + composer docking + chips */
(function(){
  var chat=document.getElementById('chat');
  var composer=document.getElementById('composer');
  var home=document.getElementById('composer-home');
  var dock=document.getElementById('composer-dock');
  function sync(){
    var has=chat.children.length>0;
    document.body.classList.toggle('has-messages',has);
    var target=has?dock:home;
    if(composer.parentNode!==target)target.appendChild(composer);
  }
  new MutationObserver(sync).observe(chat,{childList:true});
  sync();
  document.querySelectorAll('.chip[data-q]').forEach(function(ch){
    ch.addEventListener('click',function(){
      var ci=document.getElementById('ci');
      ci.value=ch.getAttribute('data-q');ci.focus();
      document.getElementById('sb').click();
    });
  });
  var thread=document.getElementById('thread');
  new MutationObserver(function(){thread.scrollTop=thread.scrollHeight;}).observe(chat,{childList:true,subtree:true});
})();
</script>
</body>
</html>
