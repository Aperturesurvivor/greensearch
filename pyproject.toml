[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arboris"
version = "0.9.0"
description = "Arboris: lower-carbon AI chat harness — right-sized answers with an honest, estimated footprint"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Grant O'Brien" },
]
keywords = ["ai", "llm", "brevity", "carbon", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.5"]

[project.scripts]
arboris = "arboris.cli:main"
# Legacy command name, kept for one release after the GreenSearch rename.
greensearch = "arboris.cli:main"

[tool.setuptools.packages.find]
include = ["arboris*", "greensearch*"]
